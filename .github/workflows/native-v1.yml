name: Native V1

on:
  push:
    branches:
      - work/clean-transcription-v1-native
  workflow_dispatch:

concurrency:
  group: native-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-v1:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app/MacAmbientJev
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test core
        run: swift test
      - name: Build app
        run: swift build --product MacAmbientJev