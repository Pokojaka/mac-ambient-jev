name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v1-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install artifact validation dependency
        run: python3 -m pip install regex
      - name: Test ClauseTagger artifact scripts
        run: |
          python3 -B scripts/test_fetch_clause_tagger.py
          python3 -B scripts/test_export_clause_tagger_onnx.py
          python3 -B scripts/test_build_app.py
      - name: Swift toolchain fingerprint
        id: toolchain
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess

          swift = subprocess.run(["swift", "--version"], check=True, capture_output=True)
          xcode = subprocess.run(["xcodebuild", "-version"], check=True, capture_output=True)
          print(swift.stdout.decode() + swift.stderr.decode(), end="")
          print(xcode.stdout.decode() + xcode.stderr.decode(), end="")
          digest = hashlib.sha256(swift.stdout + swift.stderr + xcode.stdout + xcode.stderr).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={digest}\n")
          PY
      - name: Cache SwiftPM sources
        id: swiftpm-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            app/MacAmbientJev/.build/checkouts
            app/MacAmbientJev/.build/repositories
            app/MacAmbientJev/.build/artifacts
            app/MacAmbientJev/.build/workspace-state.json
          key: swiftpm-sources-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('app/MacAmbientJev/Package.resolved') }}-${{ hashFiles('app/MacAmbientJev/Package.swift') }}
      - name: Verify V1 tests
        run: bash scripts/verify_v1_tests.sh
      - name: Save SwiftPM sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/MacAmbientJev/.build/checkouts
            app/MacAmbientJev/.build/repositories
            app/MacAmbientJev/.build/artifacts
            app/MacAmbientJev/.build/workspace-state.json
          key: ${{ steps.swiftpm-sources.outputs.cache-primary-key }}
      - name: Report SwiftPM build size
        if: always()
        run: if [ -d app/MacAmbientJev/.build ]; then du -sk app/MacAmbientJev/.build; fi
      - name: Upload Mac test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-events-macos-verify-v1-tests
          path: .build/test-events/*.jsonl
          if-no-files-found: warn
  verify-v1-app:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Swift toolchain fingerprint
        id: toolchain
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess

          swift = subprocess.run(["swift", "--version"], check=True, capture_output=True)
          xcode = subprocess.run(["xcodebuild", "-version"], check=True, capture_output=True)
          print(swift.stdout.decode() + swift.stderr.decode(), end="")
          print(xcode.stdout.decode() + xcode.stderr.decode(), end="")
          digest = hashlib.sha256(swift.stdout + swift.stderr + xcode.stdout + xcode.stderr).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={digest}\n")
          PY
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Create the local signing certificate
        run: |
          WORK="$RUNNER_TEMP/signing"
          KEYCHAIN="$WORK/signing.keychain-db"
          mkdir -p "$WORK"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=MacAmbientJev Local Signing" \
            -addext "basicConstraints=critical,CA:false" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=critical,codeSigning" \
            -keyout "$WORK/key.pem" -out "$WORK/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$WORK/key.pem" -in "$WORK/cert.pem" \
            -out "$WORK/identity.p12" -passout pass:ci
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$WORK/identity.p12" -k "$KEYCHAIN" -P ci -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Cache SwiftPM sources
        id: swiftpm-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            app/MacAmbientJev/.build/checkouts
            app/MacAmbientJev/.build/repositories
            app/MacAmbientJev/.build/artifacts
            app/MacAmbientJev/.build/workspace-state.json
          key: swiftpm-sources-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('app/MacAmbientJev/Package.resolved') }}-${{ hashFiles('app/MacAmbientJev/Package.swift') }}
      - name: Verify V1 app
        run: bash scripts/verify_v1_app.sh
      - name: Save SwiftPM sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/MacAmbientJev/.build/checkouts
            app/MacAmbientJev/.build/repositories
            app/MacAmbientJev/.build/artifacts
            app/MacAmbientJev/.build/workspace-state.json
          key: ${{ steps.swiftpm-sources.outputs.cache-primary-key }}
      - name: Report SwiftPM build size
        if: always()
        run: if [ -d app/MacAmbientJev/.build ]; then du -sk app/MacAmbientJev/.build; fi
