name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v1:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install artifact validation dependency
        run: python3 -m pip install regex
      - name: Check documentation references
        run: |
          python3 scripts/test_doc_references.py
          python3 scripts/check_doc_references.py
      - name: Swift version
        run: swift --version
      - name: Verify V1
        run: bash scripts/verify_v1.sh
