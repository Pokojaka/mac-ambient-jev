name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v1:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install artifact validation dependency
        run: python3 -m pip install regex
      - name: Check documentation references
        run: |
          python3 scripts/test_doc_references.py
          python3 scripts/check_doc_references.py
      - name: Swift version
        run: swift --version
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Create the local signing certificate
        run: |
          WORK="$RUNNER_TEMP/signing"
          KEYCHAIN="$WORK/signing.keychain-db"
          mkdir -p "$WORK"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=MacAmbientJev Local Signing" \
            -addext "basicConstraints=critical,CA:false" \
            -addext "keyUsage=critical,digitalSignature" \
            -addext "extendedKeyUsage=critical,codeSigning" \
            -keyout "$WORK/key.pem" -out "$WORK/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$WORK/key.pem" -in "$WORK/cert.pem" \
            -out "$WORK/identity.p12" -passout pass:ci
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$WORK/identity.p12" -k "$KEYCHAIN" -P ci -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Build the release app product with two jobs
        run: swift build --package-path app/MacAmbientJev --build-system swiftbuild -c release --product MacAmbientJev -j 2
      - name: Verify V1
        run: bash scripts/verify_v1.sh
