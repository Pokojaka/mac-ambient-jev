name: Portable Core

on:
  push:
    branches: [main]
    paths:
      - 'app/MacAmbientJev/Sources/MacAmbientJevCore/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPipeline/**'
      - 'app/MacAmbientJev/Sources/CONNXRuntime/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevONNX/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPortableRuntime/**'
      - 'app/MacAmbientJev/Sources/CMiniaudio/**'
      - 'app/MacAmbientJev/Sources/CWindowsAudio/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevWindowsSupport/**'
      - 'app/MacAmbientJev/Sources/CWindowsSession/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEvaluate*/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevTranscribeFile/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarizationMeasurement/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarizeFile/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevCoreTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevPipelineTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevONNXTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevPortableRuntimeTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevVADFixtures/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevCAFFixtures/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevWindowsSupportTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevTranscribeFileTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevDiarizationMeasurementTests/**'
      - 'scripts/generate_windows_audio_fixtures.py'
      - 'scripts/fetch_onnxruntime.py'
      - 'scripts/test_fetch_onnxruntime.py'
      - 'scripts/generate_onnx_fixture.py'
      - 'scripts/fetch_silero_vad.py'
      - 'scripts/test_fetch_silero_vad.py'
      - 'scripts/fetch_community1_diarization.py'
      - 'scripts/test_fetch_community1_diarization.py'
      - 'scripts/fetch_clause_tagger.py'
      - 'scripts/test_fetch_clause_tagger.py'
      - 'scripts/compare_diarization_runs.py'
      - 'scripts/test_compare_diarization_runs.py'
      - 'scripts/prepare_canonical_caf.py'
      - 'scripts/test_prepare_canonical_caf.py'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarization/Resources/**'
      - 'scripts/fetch_qwen3_asr_tokenizer.py'
      - 'scripts/test_fetch_qwen3_asr_tokenizer.py'
      - 'scripts/generate_qwen3_tokenizer_fixture.py'
      - 'scripts/pinned_download.py'
      - 'scripts/test_pinned_download.py'
      - 'scripts/generate_silero_speech_fixture.py'
      - 'scripts/generate_silero_reference.py'
      - 'scripts/test_generate_silero_reference.py'
      - 'scripts/export_clause_tagger_onnx.py'
      - 'scripts/test_export_clause_tagger_onnx.py'
      - 'tools/clause-tagger-export/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevClauseTaggerFixtures/**'
      - 'scripts/test-windows.ps1'
      - 'app/MacAmbientJev/Package.swift'
      - 'scripts/*portable*'
      - '.github/workflows/portable-core.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/MacAmbientJev/Sources/MacAmbientJevCore/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPipeline/**'
      - 'app/MacAmbientJev/Sources/CONNXRuntime/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevONNX/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPortableRuntime/**'
      - 'app/MacAmbientJev/Sources/CMiniaudio/**'
      - 'app/MacAmbientJev/Sources/CWindowsAudio/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevWindowsSupport/**'
      - 'app/MacAmbientJev/Sources/CWindowsSession/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEvaluate*/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevTranscribeFile/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarizationMeasurement/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarizeFile/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevCoreTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevPipelineTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevONNXTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevPortableRuntimeTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevVADFixtures/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevCAFFixtures/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevWindowsSupportTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevTranscribeFileTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevDiarizationMeasurementTests/**'
      - 'scripts/generate_windows_audio_fixtures.py'
      - 'scripts/fetch_onnxruntime.py'
      - 'scripts/test_fetch_onnxruntime.py'
      - 'scripts/generate_onnx_fixture.py'
      - 'scripts/fetch_silero_vad.py'
      - 'scripts/test_fetch_silero_vad.py'
      - 'scripts/fetch_community1_diarization.py'
      - 'scripts/test_fetch_community1_diarization.py'
      - 'scripts/fetch_clause_tagger.py'
      - 'scripts/test_fetch_clause_tagger.py'
      - 'scripts/compare_diarization_runs.py'
      - 'scripts/test_compare_diarization_runs.py'
      - 'scripts/prepare_canonical_caf.py'
      - 'scripts/test_prepare_canonical_caf.py'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarization/Resources/**'
      - 'scripts/fetch_qwen3_asr_tokenizer.py'
      - 'scripts/test_fetch_qwen3_asr_tokenizer.py'
      - 'scripts/generate_qwen3_tokenizer_fixture.py'
      - 'scripts/pinned_download.py'
      - 'scripts/test_pinned_download.py'
      - 'scripts/generate_silero_speech_fixture.py'
      - 'scripts/generate_silero_reference.py'
      - 'scripts/test_generate_silero_reference.py'
      - 'scripts/export_clause_tagger_onnx.py'
      - 'scripts/test_export_clause_tagger_onnx.py'
      - 'tools/clause-tagger-export/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevClauseTaggerFixtures/**'
      - 'scripts/test-windows.ps1'
      - 'app/MacAmbientJev/Package.swift'
      - 'scripts/*portable*'
      - '.github/workflows/portable-core.yml'
  workflow_dispatch:
    inputs:
      run_linux:
        description: Also run Linux (normally verified locally during development)
        type: boolean
        default: false

concurrency:
  group: portable-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || inputs.run_linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Python and FLAC
        run: apt-get update && apt-get install -y python3 flac
      - name: Fetch ONNX Runtime
        run: python3 scripts/fetch_onnxruntime.py
      - name: Fetch Silero VAD
        shell: bash
        run: |
          set -euo pipefail
          model="$(python3 scripts/fetch_silero_vad.py)"
          printf 'MAC_AMBIENT_JEV_SILERO_MODEL=%s\n' "$model" >> "$GITHUB_ENV"
      - name: Fetch Qwen3-ASR tokenizer
        shell: bash
        run: |
          set -euo pipefail
          tokenizer="$(python3 scripts/fetch_qwen3_asr_tokenizer.py)"
          printf 'MAC_AMBIENT_JEV_QWEN3_TOKENIZER=%s\n' "$tokenizer" >> "$GITHUB_ENV"
      - name: Check FLAC
        run: |
          command -v flac
          flac --version
      - name: Check portability and documentation
        run: |
          python3 -B scripts/test_portable_core.py
          python3 -B scripts/test_fetch_onnxruntime.py
          python3 -B scripts/test_fetch_silero_vad.py
          python3 -B scripts/test_fetch_community1_diarization.py
          python3 -B scripts/test_fetch_clause_tagger.py
          python3 -B scripts/test_compare_diarization_runs.py
          python3 -B scripts/test_prepare_canonical_caf.py
          python3 -B scripts/test_fetch_qwen3_asr_tokenizer.py
          python3 -B scripts/test_pinned_download.py
          python3 -B scripts/test_generate_silero_reference.py
          python3 -B scripts/test_export_clause_tagger_onnx.py
          python3 -B scripts/check_portable_core.py
          python3 scripts/test_doc_references.py
          python3 scripts/check_doc_references.py
      - name: Build Core, Pipeline, miniaudio, ONNX and all evaluators
        run: swift build --package-path app/MacAmbientJev
      - name: Test Core, Pipeline and ONNX
        run: swift test --package-path app/MacAmbientJev

  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test clause tagger exporter helpers (stdlib only)
        run: |
          python -B scripts/test_export_clause_tagger_onnx.py
          if ($LASTEXITCODE -ne 0) { throw 'Clause tagger exporter helper tests failed' }
      - name: Install FLAC
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flac-1.5.0-win.zip'
          Invoke-WebRequest https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0-win.zip -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '53f1500f0d6e7c61379d7fee50d4a9f7f504c650009506d9ba015530d76c0dde') {
            throw 'FLAC 1.5.0 archive SHA-256 checksum mismatch.'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'flac'
          Expand-Archive -Path $archive -DestinationPath $destination
          Join-Path $destination 'flac-1.5.0-win/Win64' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check FLAC
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command flac -CommandType Application -ErrorAction Stop
          flac --version
          if ($LASTEXITCODE -ne 0) { throw 'flac --version failed' }
      - name: Check and test Core, Pipeline, WindowsSupport and ONNX
        run: ./scripts/test-windows.ps1
