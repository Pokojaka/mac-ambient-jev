name: Portable Core

on:
  push:
    branches: [main]
    paths:
      - 'app/MacAmbientJev/Sources/MacAmbientJevCore/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPipeline/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEngineProtocol/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEngineHost/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEngine/**'
      - 'app/MacAmbientJev/Sources/CONNXRuntime/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevONNX/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPortableRuntime/**'
      - 'app/MacAmbientJev/Sources/CMiniaudio/**'
      - 'app/MacAmbientJev/Sources/CWindowsAudio/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevWindowsSupport/**'
      - 'app/MacAmbientJev/Sources/CWindowsSession/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEvaluate*/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevTranscribeFile/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarizationMeasurement/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarizeFile/**'
      - 'app/MacAmbientJev/Tests/**'
      - 'scripts/generate_windows_audio_fixtures.py'
      - 'scripts/fetch_onnxruntime.py'
      - 'scripts/test_fetch_onnxruntime.py'
      - 'scripts/generate_onnx_fixture.py'
      - 'scripts/fetch_silero_vad.py'
      - 'scripts/test_fetch_silero_vad.py'
      - 'scripts/fetch_community1_diarization.py'
      - 'scripts/test_fetch_community1_diarization.py'
      - 'scripts/fetch_clause_tagger.py'
      - 'scripts/test_fetch_clause_tagger.py'
      - 'scripts/compare_diarization_runs.py'
      - 'scripts/test_compare_diarization_runs.py'
      - 'scripts/prepare_canonical_caf.py'
      - 'scripts/test_prepare_canonical_caf.py'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarization/Resources/**'
      - 'scripts/fetch_qwen3_asr_tokenizer.py'
      - 'scripts/test_fetch_qwen3_asr_tokenizer.py'
      - 'scripts/generate_qwen3_tokenizer_fixture.py'
      - 'scripts/pinned_download.py'
      - 'scripts/test_pinned_download.py'
      - 'scripts/generate_silero_speech_fixture.py'
      - 'scripts/generate_silero_reference.py'
      - 'scripts/test_generate_silero_reference.py'
      - 'scripts/export_clause_tagger_onnx.py'
      - 'scripts/test_export_clause_tagger_onnx.py'
      - 'tools/clause-tagger-export/**'
      - 'scripts/test-windows.ps1'
      - 'scripts/fetch_qwen3_asr_model.py'
      - 'scripts/test_fetch_qwen3_asr_model.py'
      - 'app/MacAmbientJev/Sources/MacAmbientJevProcessRecording/**'
      - 'tools/linux-audio/process_recording_acceptance.py'
      - 'tools/linux-audio/tests/fake_process_recording.py'
      - 'tools/linux-audio/tests/test_process_recording_acceptance.py'
      - 'app/MacAmbientJev/Package.swift'
      - 'scripts/*portable*'
      - 'scripts/check_test_time_limits.py'
      - 'scripts/report_test_events.py'
      - 'scripts/run_swift_tests.py'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'scripts/check_doc_references.py'
      - '.github/workflows/portable-core.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/MacAmbientJev/Sources/MacAmbientJevCore/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPipeline/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEngineProtocol/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEngineHost/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEngine/**'
      - 'app/MacAmbientJev/Sources/CONNXRuntime/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevONNX/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPortableRuntime/**'
      - 'app/MacAmbientJev/Sources/CMiniaudio/**'
      - 'app/MacAmbientJev/Sources/CWindowsAudio/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevWindowsSupport/**'
      - 'app/MacAmbientJev/Sources/CWindowsSession/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEvaluate*/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevTranscribeFile/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarizationMeasurement/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarizeFile/**'
      - 'app/MacAmbientJev/Tests/**'
      - 'scripts/generate_windows_audio_fixtures.py'
      - 'scripts/fetch_onnxruntime.py'
      - 'scripts/test_fetch_onnxruntime.py'
      - 'scripts/generate_onnx_fixture.py'
      - 'scripts/fetch_silero_vad.py'
      - 'scripts/test_fetch_silero_vad.py'
      - 'scripts/fetch_community1_diarization.py'
      - 'scripts/test_fetch_community1_diarization.py'
      - 'scripts/fetch_clause_tagger.py'
      - 'scripts/test_fetch_clause_tagger.py'
      - 'scripts/compare_diarization_runs.py'
      - 'scripts/test_compare_diarization_runs.py'
      - 'scripts/prepare_canonical_caf.py'
      - 'scripts/test_prepare_canonical_caf.py'
      - 'app/MacAmbientJev/Sources/MacAmbientJevDiarization/Resources/**'
      - 'scripts/fetch_qwen3_asr_tokenizer.py'
      - 'scripts/test_fetch_qwen3_asr_tokenizer.py'
      - 'scripts/generate_qwen3_tokenizer_fixture.py'
      - 'scripts/pinned_download.py'
      - 'scripts/test_pinned_download.py'
      - 'scripts/generate_silero_speech_fixture.py'
      - 'scripts/generate_silero_reference.py'
      - 'scripts/test_generate_silero_reference.py'
      - 'scripts/export_clause_tagger_onnx.py'
      - 'scripts/test_export_clause_tagger_onnx.py'
      - 'tools/clause-tagger-export/**'
      - 'scripts/test-windows.ps1'
      - 'scripts/fetch_qwen3_asr_model.py'
      - 'scripts/test_fetch_qwen3_asr_model.py'
      - 'app/MacAmbientJev/Sources/MacAmbientJevProcessRecording/**'
      - 'tools/linux-audio/process_recording_acceptance.py'
      - 'tools/linux-audio/tests/fake_process_recording.py'
      - 'tools/linux-audio/tests/test_process_recording_acceptance.py'
      - 'app/MacAmbientJev/Package.swift'
      - 'scripts/*portable*'
      - 'scripts/check_test_time_limits.py'
      - 'scripts/report_test_events.py'
      - 'scripts/run_swift_tests.py'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'scripts/check_doc_references.py'
      - '.github/workflows/portable-core.yml'
  workflow_dispatch:
    inputs:
      run_linux:
        description: Also run Linux (normally verified locally during development)
        type: boolean
        default: false

concurrency:
  group: portable-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || inputs.run_linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Python and FLAC
        run: apt-get update && apt-get install -y python3 flac
      - name: Fetch ONNX Runtime
        run: python3 scripts/fetch_onnxruntime.py
      - name: Fetch Silero VAD
        shell: bash
        run: |
          set -euo pipefail
          model="$(python3 scripts/fetch_silero_vad.py)"
          printf 'MAC_AMBIENT_JEV_SILERO_MODEL=%s\n' "$model" >> "$GITHUB_ENV"
      - name: Fetch Qwen3-ASR tokenizer
        shell: bash
        run: |
          set -euo pipefail
          tokenizer="$(python3 scripts/fetch_qwen3_asr_tokenizer.py)"
          printf 'MAC_AMBIENT_JEV_QWEN3_TOKENIZER=%s\n' "$tokenizer" >> "$GITHUB_ENV"
      - name: Fetch clause tagger model
        shell: bash
        run: |
          set -euo pipefail
          model="$(python3 scripts/fetch_clause_tagger.py --format onnx)"
          printf 'MAC_AMBIENT_JEV_CLAUSE_TAGGER_MODEL_DIRECTORY=%s\n' "$model" >> "$GITHUB_ENV"
      - name: Check FLAC
        run: |
          command -v flac
          flac --version
      - name: Check portability and documentation
        run: |
          python3 -B scripts/check_test_time_limits.py
          python3 -B scripts/test_fetch_onnxruntime.py
          python3 -B scripts/test_fetch_silero_vad.py
          python3 -B scripts/test_fetch_community1_diarization.py
          python3 -B scripts/test_fetch_clause_tagger.py
          python3 -B scripts/test_compare_diarization_runs.py
          python3 -B scripts/test_prepare_canonical_caf.py
          python3 -B scripts/test_fetch_qwen3_asr_tokenizer.py
          python3 -B scripts/test_pinned_download.py
          python3 -B scripts/test_generate_silero_reference.py
          python3 -B scripts/test_export_clause_tagger_onnx.py
          python3 -B scripts/check_portable_core.py
          python3 scripts/check_doc_references.py
      # MacAmbientJevEngine and WindowsSupport are Windows-only, not Linux build products.
      - name: Build Core, EngineProtocol, EngineHost, Pipeline, PortableRuntime, ONNX and all evaluators
        run: swift build --package-path app/MacAmbientJev
      - name: Test Core, EngineProtocol, EngineHost, Pipeline, PortableRuntime and ONNX
        run: python3 -B scripts/run_swift_tests.py --package-path app/MacAmbientJev --event-stream-output-path "$GITHUB_WORKSPACE/.build/test-events/linux.jsonl"
      - name: Upload Linux test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-events-linux
          path: .build/test-events/*.jsonl
          if-no-files-found: warn

  linux-model-e2e:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || inputs.run_linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Python, pytest and FLAC
        run: apt-get update && apt-get install -y python3 python3-pytest flac
      - name: Test the acceptance driver without models
        working-directory: tools/linux-audio
        run: python3 -m pytest -q tests/test_process_recording_acceptance.py
      - name: Restore model directories
        id: model-directories
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/qwen3-asr-models
            .build/qwen3-asr-tokenizer
            .build/silero-vad
            .build/community1-diarization
            .build/clause-tagger-onnx
          key: models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/MacAmbientJev/Sources/MacAmbientJevPortableRuntime/Resources/qwen3_asr_models.json', 'app/MacAmbientJev/Sources/MacAmbientJevPortableRuntime/Resources/clause_tagger_model.json', 'app/MacAmbientJev/Sources/MacAmbientJevDiarization/Resources/community1_diarization_models.json', 'scripts/fetch_qwen3_asr_model.py', 'scripts/fetch_qwen3_asr_tokenizer.py', 'scripts/fetch_silero_vad.py', 'scripts/fetch_community1_diarization.py', 'scripts/fetch_clause_tagger.py', 'scripts/pinned_download.py') }}
      - name: Fetch models (hashes are verified on cache hits), run numerical suites and acceptance driver
        run: bash scripts/verify_portable.sh --full-model
      - name: Save model directories
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.model-directories.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/qwen3-asr-models
            .build/qwen3-asr-tokenizer
            .build/silero-vad
            .build/community1-diarization
            .build/clause-tagger-onnx
          key: ${{ steps.model-directories.outputs.cache-primary-key }}
      - name: Upload Linux model E2E test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-events-linux-model-e2e
          path: .build/test-events/*.jsonl
          if-no-files-found: warn

  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      # Its internal cache switch controls restore and save together with no save-only condition, so it can still save on PRs.
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Swift toolchain fingerprint
        id: toolchain
        run: |
          @'
          import hashlib
          import os
          import subprocess

          result = subprocess.run(["swift", "--version"], check=True, capture_output=True)
          print(result.stdout.decode() + result.stderr.decode(), end="")
          digest = hashlib.sha256(result.stdout + result.stderr).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={digest}\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Swift toolchain fingerprint failed' }
      - name: Restore model directories
        id: model-directories
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/qwen3-asr-models
            .build/qwen3-asr-tokenizer
            .build/silero-vad
            .build/community1-diarization
            .build/clause-tagger-onnx
          key: models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/MacAmbientJev/Sources/MacAmbientJevPortableRuntime/Resources/qwen3_asr_models.json', 'app/MacAmbientJev/Sources/MacAmbientJevPortableRuntime/Resources/clause_tagger_model.json', 'app/MacAmbientJev/Sources/MacAmbientJevDiarization/Resources/community1_diarization_models.json', 'scripts/fetch_qwen3_asr_model.py', 'scripts/fetch_qwen3_asr_tokenizer.py', 'scripts/fetch_silero_vad.py', 'scripts/fetch_community1_diarization.py', 'scripts/fetch_clause_tagger.py', 'scripts/pinned_download.py') }}
      # Full-build artifacts rely on GitHub's stable workspace layout; never restore across OS/arch/toolchain.
      - name: Cache SwiftPM build
        id: swiftpm-build
        uses: actions/cache/restore@v4
        with:
          path: app/MacAmbientJev/.build
          key: swiftpm-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('app/MacAmbientJev/Package.resolved') }}-${{ hashFiles('app/MacAmbientJev/Package.swift') }}
          restore-keys: |
            swiftpm-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-
      - name: Test clause tagger exporter helpers (stdlib only)
        run: |
          python -B scripts/test_export_clause_tagger_onnx.py
          if ($LASTEXITCODE -ne 0) { throw 'Clause tagger exporter helper tests failed' }
      - name: Install FLAC
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flac-1.5.0-win.zip'
          Invoke-WebRequest https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0-win.zip -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '53f1500f0d6e7c61379d7fee50d4a9f7f504c650009506d9ba015530d76c0dde') {
            throw 'FLAC 1.5.0 archive SHA-256 checksum mismatch.'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'flac'
          Expand-Archive -Path $archive -DestinationPath $destination
          Join-Path $destination 'flac-1.5.0-win/Win64' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check FLAC
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command flac -CommandType Application -ErrorAction Stop
          flac --version
          if ($LASTEXITCODE -ne 0) { throw 'flac --version failed' }
      - name: Windows engine build and EngineProtocol/EngineHost/WindowsSupport fast suites
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw 'RUNNER_TEMP must be nonempty' }
          if (-not [System.IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP)) { throw 'RUNNER_TEMP must be an absolute path' }
          if (-not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) { throw 'RUNNER_TEMP must be an existing directory' }
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          Write-Output "RUNNER_TEMP=$env:RUNNER_TEMP"
          Write-Output "TEMP=$env:TEMP"
          Write-Output "TMP=$env:TMP"
          Write-Output "TMPDIR=$env:TMPDIR"
          python -c "import os,pathlib,sys,tempfile; expected=pathlib.Path(os.environ['RUNNER_TEMP']); actual=pathlib.Path(tempfile.gettempdir()); print(f'tempfile.gettempdir()={actual}'); sys.exit(0 if actual.resolve() == expected.resolve() else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Python tempfile.gettempdir() does not resolve to RUNNER_TEMP' }
          ./scripts/test-windows.ps1
      - name: Save model directories
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.model-directories.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/qwen3-asr-models
            .build/qwen3-asr-tokenizer
            .build/silero-vad
            .build/community1-diarization
            .build/clause-tagger-onnx
          key: ${{ steps.model-directories.outputs.cache-primary-key }}
      - name: Save SwiftPM build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/MacAmbientJev/.build
          key: ${{ steps.swiftpm-build.outputs.cache-primary-key }}
      - name: Upload Windows test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-events-windows
          path: .build/test-events/*.jsonl
          if-no-files-found: warn
      - name: Report Windows SwiftPM build size
        if: always()
        run: |
          $build = 'app/MacAmbientJev/.build'
          if (Test-Path -LiteralPath $build -PathType Container) {
            python scripts/report_build_size.py $build
            if ($LASTEXITCODE -ne 0) { throw 'Unable to measure SwiftPM build size' }
          }
