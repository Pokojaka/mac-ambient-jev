name: Portable Core

on:
  push:
    branches: [main]
    paths:
      - 'app/MacAmbientJev/Sources/MacAmbientJevCore/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPipeline/**'
      - 'app/MacAmbientJev/Sources/CMiniaudio/**'
      - 'app/MacAmbientJev/Sources/CWindowsAudio/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevWindowsSupport/**'
      - 'app/MacAmbientJev/Sources/CWindowsSession/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEvaluate*/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevCoreTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevPipelineTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevWindowsSupportTests/**'
      - 'scripts/generate_windows_audio_fixtures.py'
      - 'app/MacAmbientJev/Package.swift'
      - 'scripts/*portable*'
      - '.github/workflows/portable-core.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/MacAmbientJev/Sources/MacAmbientJevCore/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevPipeline/**'
      - 'app/MacAmbientJev/Sources/CMiniaudio/**'
      - 'app/MacAmbientJev/Sources/CWindowsAudio/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevWindowsSupport/**'
      - 'app/MacAmbientJev/Sources/CWindowsSession/**'
      - 'app/MacAmbientJev/Sources/MacAmbientJevEvaluate*/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevCoreTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevPipelineTests/**'
      - 'app/MacAmbientJev/Tests/MacAmbientJevWindowsSupportTests/**'
      - 'scripts/generate_windows_audio_fixtures.py'
      - 'app/MacAmbientJev/Package.swift'
      - 'scripts/*portable*'
      - '.github/workflows/portable-core.yml'
  workflow_dispatch:
    inputs:
      run_linux:
        description: Also run Linux (normally verified locally during development)
        type: boolean
        default: false

concurrency:
  group: portable-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'workflow_dispatch' || inputs.run_linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Python and FLAC
        run: apt-get update && apt-get install -y python3 flac
      - name: Check FLAC
        run: |
          command -v flac
          flac --version
      - name: Check portability and documentation
        run: |
          python3 -B scripts/test_portable_core.py
          python3 -B scripts/check_portable_core.py
          python3 scripts/test_doc_references.py
          python3 scripts/check_doc_references.py
      - name: Build Core, Pipeline, miniaudio and all three evaluators
        run: swift build --package-path app/MacAmbientJev
      - name: Test Core and Pipeline
        run: swift test --package-path app/MacAmbientJev

  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install FLAC
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flac-1.5.0-win.zip'
          Invoke-WebRequest https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0-win.zip -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '53f1500f0d6e7c61379d7fee50d4a9f7f504c650009506d9ba015530d76c0dde') {
            throw 'FLAC 1.5.0 archive SHA-256 checksum mismatch.'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'flac'
          Expand-Archive -Path $archive -DestinationPath $destination
          Join-Path $destination 'flac-1.5.0-win/Win64' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check FLAC
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command flac -CommandType Application -ErrorAction Stop
          flac --version
          if ($LASTEXITCODE -ne 0) { throw 'flac --version failed' }
      - name: Check portability and documentation
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B scripts/test_portable_core.py
          python -B scripts/check_portable_core.py
          python scripts/test_doc_references.py
          python scripts/check_doc_references.py
      - name: Build Core, Pipeline, WindowsSupport and all three evaluators
        run: swift build --package-path app/MacAmbientJev
      - name: Test Core, Pipeline and WindowsSupport
        run: swift test --package-path app/MacAmbientJev
